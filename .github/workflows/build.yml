name: build
on: [pull_request, push]
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft-version: '1.21.5'
            fabric-api-version: '0.125.0+1.21.5'
            modmenu-version: '14.0.0'
          - minecraft-version: '1.21.6'
            fabric-api-version: '0.124.4+1.21.6'
            modmenu-version: '15.0.0'
          - minecraft-version: '1.21.7'
            fabric-api-version: '0.128.2+1.21.7'
            modmenu-version: '15.0.0'
          - minecraft-version: '1.21.8'
            fabric-api-version: '0.129.0+1.21.8'
            modmenu-version: '15.0.0'
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: build
        run: >-
          ./gradlew build
          -Ploom_version=1.10.5
          -Ploader_version=0.16.14
          -Pminecraft_version=${{ matrix.minecraft-version }}
          -Pfabric_api_version=${{ matrix.fabric-api-version }}
          -Pmodmenu_version=${{ matrix.modmenu-version }}
          -Pversion=1.0.0+mc${{ matrix.minecraft-version }}
          -Pminecraft_dependency=${{ matrix.minecraft-version }}
          -Pfabric_api_dependency=">=${{ matrix.fabric-api-version }}"
          -Pjava_version=21
      - uses: actions/upload-artifact@v7
        with:
          name: XP-Orb-Trails-${{ matrix.minecraft-version }}
          path: build/libs/*.jar
