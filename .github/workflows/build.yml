name: build
on:
  push:
    branches: [26.1.x]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft-version: '26.1'
            fabric-api-version: '0.144.3+26.1'
          - minecraft-version: '26.1.1'
            fabric-api-version: '0.145.4+26.1.1'
          - minecraft-version: '26.1.2'
            fabric-api-version: '0.145.4+26.1.2'
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: build
        shell: bash
        run: |
          set +e
          ./gradlew build \
          -Ploom_version=1.17.20 \
          -Pminecraft_version=${{ matrix.minecraft-version }} \
          -Ploader_version=0.18.5 \
          -Pfabric_api_version=${{ matrix.fabric-api-version }} \
          -Pmodmenu_version=18.0.0-beta.1 \
          -Pversion=1.0.0+mc${{ matrix.minecraft-version }} \
          -Pminecraft_dependency=${{ matrix.minecraft-version }} \
          -Pfabric_api_dependency=">=${{ matrix.fabric-api-version }}" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -c 5000 build.log | tr '\n' ' ')
            echo "::error::$message"
            exit "$status"
          fi
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: XP-Orb-Trails-${{ matrix.minecraft-version }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: upload binary to v1.0.0 release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.0 build/libs/xp-orb-trails-1.0.0+mc${{ matrix.minecraft-version }}.jar --clobber
